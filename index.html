<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
   
</head>
<body>
<center>

    <h1>Welcome to Number Guessing Game</h1>
    <h3>Designed by Adhithya</h3>
    <h2>Rules:</h2>
    <p>1. Guess the number between 0 and 100.</p>
    <p>2. You have unlimited attempts.</p>

    
</center>
<form>
<center> 
     <label>Guess the Number :</label>
    <input type="integer" id="num" placeholder="Guess between 0 to 100"> <br>
    <button  onclick="guessNumber()" type="button" >submit</button>
    <button  onclick="restartGame()" type="button" >Restart</button>
</center>
</form>
<script src="script.js"></script>

<div id="attempt-counter">
    <h1 >Attempts:</h1>
    <p id="attempts">-</p>
</div>
   
</body>
</html>
